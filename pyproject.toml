[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "html-presentations-with-python"
version = "0.1.3"
description = "A Python DSL for building HTML presentations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
authors = [
	{ name = "html-presentations-with-python contributors" },
]
keywords = ["html", "presentation", "slides", "python", "dsl"]
classifiers = [
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
	"Operating System :: OS Independent",
]

[tool.setuptools.packages.find]
include = ["html_presentations*"]

[tool.pytest.ini_options]
pythonpath = ["."]
